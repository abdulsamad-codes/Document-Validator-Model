[mypy]
python_version = 3.12
files = app
ignore_missing_imports = True
plugins = pydantic.mypy
disallow_untyped_defs = False
warn_unused_ignores = True
warn_redundant_casts = True

# FastAPI's Depends()/File()/responses= typing produces known false positives
# (Ellipsis-typed defaults, OpenAPI response-dict shape) across every routes.py
# in this codebase -- see the foundation audit's Section 9 for the evidence.
[mypy-app.*.routes]
disable_error_code = arg-type, assignment, dict-item
